<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Alunos</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <table class="tabela">
        <thead class="cabecalho">
            <tr>
                <th>Nome</th>
                <th>Nota</th>
                <th>Situação</th>
            </tr>
        </thead>
        <tbody class="linhas">
            <tr class="info">
                <td>Ana</td>
                <td>85</td>
                <td class="aprovado">Aprovado</td>
            </tr>
            <tr class="info">
                <td>Carlos</td>
                <td>55</td>
                <td class="recuperacao">Recuperação</td>
            </tr>
            <tr class="info">
                <td>Maria</td>
                <td>92</td>
                <td class="aprovado">Aprovado</td>
            </tr>
            <tr class="info">
                <td>João</td>
                <td>38</td>
                <td class="reprovado">Reprovado</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
